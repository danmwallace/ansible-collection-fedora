# SPDX-License-Identifier: MIT
---
# tasks file for hyprland

- name: "Load theme variables"
  ansible.builtin.include_vars:
    file: "themes/{{ hyprland_theme }}.yml"

- name: "Ensure the python-dnf bindings required by the copr module are present"
  ansible.builtin.dnf:
    name: python3-dnf
    state: present
  become: true
  when: hyprland_manage_copr

- name: "Ensure lionheartp/Hyprland COPR repository is enabled"
  community.general.copr:
    name: lionheartp/Hyprland
    state: enabled
  become: true
  when: hyprland_manage_copr

- name: "Ensure Hyprland and its supporting packages are installed"
  ansible.builtin.dnf:
    name:
      - hyprland
      - hyprland-guiutils
      - hyprpaper
      - hyprpicker
      - hypridle
      - hyprlock
      - hyprpolkitagent
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      - sddm
      - sddm-x11
      - waybar
      - alacritty
      - wofi
      - nwg-drawer
      - waypaper
      - swaybg
      - cliphist
      - wl-clipboard
      - grim
      - slurp
      - pamixer
      - pavucontrol
      - light
      - bluez
      - bluez-tools
      - blueman
      - tuned
      - tuned-ppd
      - network-manager-applet
      - NetworkManager-wifi
      - nm-connection-editor-desktop
      - gnome-keyring
      - qt6ct
      - qt5-qtwayland
      - qt6-qtwayland
      - cups-pk-helper
      - podman
      - nautilus
      - simple-scan
      - alsa-sof-firmware
      - alsa-utils
      - gvfs
      - gvfs-mtp
    state: present
  become: true

- name: "Ensure desktop applications are installed"
  ansible.builtin.dnf:
    name: "{{ hyprland_desktop_apps }}"
    state: present
  become: true
  when: hyprland_desktop_apps | length > 0

- name: "Check whether the Nerd Font is already installed"
  ansible.builtin.stat:
    path: "{{ hyprland_nerd_font_dir }}/RobotoMonoNerdFontPropo-Regular.ttf"
  register: hyprland_nerd_font_marker

- name: "Ensure the Nerd Font archive is downloaded"
  ansible.builtin.get_url:
    url: "{{ hyprland_nerd_font_url }}"
    dest: /tmp/hyprland-nerd-font.tar.xz
    checksum: "{{ hyprland_nerd_font_checksum }}"
    mode: "0644"
  when: not hyprland_nerd_font_marker.stat.exists

- name: "Ensure the Nerd Font directory exists"
  ansible.builtin.file:
    path: "{{ hyprland_nerd_font_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: "Ensure the Nerd Font is installed"
  ansible.builtin.unarchive:
    src: /tmp/hyprland-nerd-font.tar.xz
    dest: "{{ hyprland_nerd_font_dir }}"
    remote_src: true
    creates: "{{ hyprland_nerd_font_dir }}/RobotoMonoNerdFontPropo-Regular.ttf"
    mode: "0644"
  become: true
  when: not hyprland_nerd_font_marker.stat.exists
  notify: Refresh font cache

- name: "Ensure the Nerd Font archive is removed after install"
  ansible.builtin.file:
    path: /tmp/hyprland-nerd-font.tar.xz
    state: absent
  when: not hyprland_nerd_font_marker.stat.exists

- name: "Ensure SDDM is enabled and running"
  ansible.builtin.systemd_service:
    name: sddm
    enabled: true
    state: started
  become: true
  when: hyprland_manage_services

- name: "Ensure the default systemd target is graphical"
  ansible.builtin.command: "systemctl set-default graphical.target"
  become: true
  register: hyprland_set_default
  changed_when: "'Created symlink' in (hyprland_set_default.stderr | default(''))"
  when: hyprland_manage_services

- name: "Ensure config directories exist"
  ansible.builtin.file:
    path: "{{ hyprland_home_dir }}/.config/{{ item }}"
    state: directory
    owner: "{{ hyprland_file_owner }}"
    group: "{{ hyprland_file_owner }}"
    mode: "0755"
  become: true
  become_user: "{{ hyprland_file_owner }}"
  loop:
    - hypr
    - hypr/conf
    - hypr/scripts
    - waybar
    - alacritty
    - wofi
    - nwg-drawer
    - nwg-dock-hyprland

- name: "Ensure static Hyprland configuration files are present"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ hyprland_home_dir }}/.config/{{ item.dest }}"
    owner: "{{ hyprland_file_owner }}"
    group: "{{ hyprland_file_owner }}"
    mode: "0755"
  become: true
  become_user: "{{ hyprland_file_owner }}"
  loop:
    - src: home/dwallace/config/hypr/xdg-portal-hyprland
      dest: hypr/xdg-portal-hyprland
    - src: home/dwallace/config/hypr/scripts/sleep.sh
      dest: hypr/scripts/sleep.sh
    - src: home/dwallace/config/wofi/config
      dest: wofi/config

- name: "Ensure themed configuration files are rendered"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ hyprland_home_dir }}/.config/{{ item.dest }}"
    owner: "{{ hyprland_file_owner }}"
    group: "{{ hyprland_file_owner }}"
    mode: "0644"
  become: true
  become_user: "{{ hyprland_file_owner }}"
  loop:
    - src: home/config/hypr/hyprland.lua.j2
      dest: hypr/hyprland.lua
    - src: home/config/hypr/conf/monitors.lua.j2
      dest: hypr/conf/monitors.lua
    - src: home/config/hypr/conf/env.lua.j2
      dest: hypr/conf/env.lua
    - src: home/config/hypr/conf/autostart.lua.j2
      dest: hypr/conf/autostart.lua
    - src: home/config/hypr/conf/look.lua.j2
      dest: hypr/conf/look.lua
    - src: home/config/hypr/conf/input.lua.j2
      dest: hypr/conf/input.lua
    - src: home/config/hypr/conf/binds.lua.j2
      dest: hypr/conf/binds.lua
    - src: home/config/hypr/conf/rules.lua.j2
      dest: hypr/conf/rules.lua
    - src: home/config/hypr/hyprlock.conf.j2
      dest: hypr/hyprlock.conf
    - src: home/config/waybar/style.css.j2
      dest: waybar/style.css
    - src: home/config/waybar/config.j2
      dest: waybar/config
    - src: home/config/alacritty/alacritty.toml.j2
      dest: alacritty/alacritty.toml
    - src: home/config/wofi/style.css.j2
      dest: wofi/style.css
    - src: home/config/wofi/style-power.css.j2
      dest: wofi/style-power.css
    - src: home/config/wofi/style-run.css.j2
      dest: wofi/style-run.css
    - src: home/config/nwg-drawer/drawer.css.j2
      dest: nwg-drawer/drawer.css
    - src: home/config/nwg-dock-hyprland/style.css.j2
      dest: nwg-dock-hyprland/style.css

- name: "Ensure a per-machine local.lua exists (never overwritten)"
  ansible.builtin.copy:
    content: "-- Per-machine Hyprland overrides, loaded last by hyprland.lua. Never managed.\n"
    dest: "{{ hyprland_home_dir }}/.config/hypr/local.lua"
    owner: "{{ hyprland_file_owner }}"
    group: "{{ hyprland_file_owner }}"
    mode: "0644"
    force: false
  become: true
  become_user: "{{ hyprland_file_owner }}"

- name: "Ensure SDDM configuration is present"
  ansible.builtin.copy:
    src: "etc/sddm.conf.d/"
    dest: "/etc/sddm.conf.d/"
    mode: "0644"
  become: true
