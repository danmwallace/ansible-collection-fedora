---
argument_specs:
  main:
    short_description: Install and configure the Hyprland tiling Wayland compositor on Fedora.
    description:
      - Enables the lionheartp/Hyprland COPR repository and installs Hyprland together with a
        curated set of supporting tools (SDDM, Waybar, Alacritty, Wofi, nwg-drawer, etc.).
      - Renders themed user dotfiles under the target user's ~/.config/ tree and deploys
        SDDM theme/configuration files at the system level.
    author:
      - Dan Wallace
    options:
      hyprland_user:
        description:
          - Local user account that owns the rendered Hyprland dotfiles under /home/<user>/.config/.
            Defaults to the value of $USER on the controller, which is usually not what
            you want when running against a remote host — override explicitly.
        type: str
        required: false
      hyprland_theme:
        description:
          - Name of the theme palette to apply. Must match a file under vars/themes/<theme>.yml
            shipped with the role.
        type: str
        required: false
        default: nord
        choices:
          - monochrome
          - nord
          - tokyo-night
      hyprland_home_dir:
        description:
          - Directory that receives the rendered .config tree. Defaults to the target
            user's home. Set to /etc/skel to render a template home for users created
            later, for example inside a bootc image build; files are then root-owned.
        type: str
        required: false
        default: "/home/{{ hyprland_user }}"
      hyprland_manage_copr:
        description:
          - Whether the role enables the lionheartp/Hyprland COPR. Set false when the
            caller enabled it already (image builds use dnf copr enable).
        type: bool
        required: false
        default: true
      hyprland_manage_services:
        description:
          - Whether the role enables and starts sddm and sets graphical.target as the
            default. Set false where systemd is not running, such as a container build.
        type: bool
        required: false
        default: true
      hyprland_wallpaper:
        description:
          - Image path passed to swaybg at session start.
        type: str
        required: false
        default: "~/Pictures/Wallpapers/gray-abstract.jpg"
      hyprland_lock_wallpaper:
        description:
          - Image path used as the hyprlock background.
        type: str
        required: false
        default: "~/Pictures/Wallpapers/purple-green-foliage.jpg"
