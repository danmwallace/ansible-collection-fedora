---
- name: Converge
  hosts: molecule
  gather_facts: true
  tasks:
    # Inside the systemd container resolved has no upstream servers and
    # /etc/resolv.conf is its stub symlink, so lookups never reach the
    # nameservers podman wrote. Stop resolved and make resolv.conf a plain
    # file holding those nameservers.
    - name: Ensure systemd-resolved is not intercepting DNS in the container
      ansible.builtin.shell: |
        set -e
        systemctl disable --now systemd-resolved
        tmp=$(mktemp)
        cat /etc/resolv.conf > "$tmp"
        rm -f /etc/resolv.conf
        install -m 0644 "$tmp" /etc/resolv.conf
      changed_when: false

    - name: Ensure target user exists for dotfile rendering
      ansible.builtin.user:
        name: hyprtest
        shell: /bin/bash
        create_home: true
        state: present

    - name: Apply hyprland role with test values
      ansible.builtin.include_role:
        name: danmwallace.fedora.hyprland
      vars:
        hyprland_user: hyprtest
        hyprland_theme: nord
