---
# defaults file for hyprland

hyprland_user: "{{ ansible_facts['env']['USER'] }}"
hyprland_theme: "nord"

# Directory that receives the rendered .config tree. Point at /etc/skel to
# render a template home for users created later (used by image builds).
hyprland_home_dir: "/home/{{ hyprland_user }}"

# Set false when the caller has already enabled the lionheartp/Hyprland COPR
# (image builds do it with `dnf copr enable` before running the role).
hyprland_manage_copr: true

# Set false where systemd is not running (container image builds). The role
# then neither enables/starts sddm nor changes the default target.
hyprland_manage_services: true

# Wallpaper shown by swaybg, and the hyprlock background. Any path readable by
# the user; image builds point these at a file shipped in /usr/share.
hyprland_wallpaper: "~/Pictures/Wallpapers/gray-abstract.jpg"
hyprland_lock_wallpaper: "~/Pictures/Wallpapers/purple-green-foliage.jpg"

# Nerd Font the Waybar, Wofi and hyprlock templates reference as
# RobotoMonoNerdFontPropo. Pinned upstream release; bump both values together.
hyprland_nerd_font_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/RobotoMono.tar.xz"
hyprland_nerd_font_checksum: "sha256:61f53438b240a00c87c92dc2c372db0bbb264473b36a8144ea62babf787f8383"
hyprland_nerd_font_dir: /usr/share/fonts/roboto-mono-nerd

# Desktop applications installed as RPMs. Image builds set this to [] and ship
# them as Flatpaks instead.
hyprland_desktop_apps:
  - firefox
  - libreoffice
  - thunderbird
